<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#FAF3E6"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="40" y1="36" x2="120" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E29238"/>
      <stop offset="100%" stop-color="#B86920"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="80" y1="46" x2="114" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5BA63"/>
      <stop offset="100%" stop-color="#D98024"/>
    </linearGradient>
    <filter id="softGlow" x="20" y="20" width="120" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C77A2E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="160" height="160" rx="40" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="158" height="158" rx="39" stroke="#E8D8C1" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Logo Mark: Stylized Access Monogram 'A' with AI Spark -->
  <g filter="url(#softGlow)">
    <!-- Outer Arch: Universal Access Arc -->
    <path d="M42 118C42 86 58 44 80 44C102 44 118 86 118 118" stroke="url(#primaryGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Bridge / Horizon Line -->
    <path d="M54 92H106" stroke="#2F241C" stroke-width="10" stroke-linecap="round"/>

    <!-- AI Spark / Node in upper core -->
    <path d="M80 50C80 62 88 70 100 70C88 70 80 78 80 90C80 78 72 70 60 70C72 70 80 62 80 50Z" fill="url(#sparkGrad)"/>
    
    <!-- Precision Center Core Point -->
    <circle cx="80" cy="70" r="3" fill="#FFFDF8"/>
  </g>
</svg>